[project]
name = "faq-extraction-pipeline"
version = "0.1.0"
description = "AI-powered pipeline to extract and deduplicate FAQs from chatbot conversations"
requires-python = ">=3.11"
dependencies = [
    "altair>=6.0.0",
    "anthropic[vertex]>=0.75.0",
    "hdbscan>=0.8.40",
    "langchain>=1.1.2",
    "langchain-google-vertexai>=3.1.1",
    "langchain-qdrant>=1.1.0",
    "langgraph>=1.0.4",
    "matplotlib>=3.10.7",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0",
    "qdrant-client>=1.16.1",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "streamlit>=1.40.0",
    "umap-learn>=0.5.7",
    "numba>=0.60.0",  # Required for Python 3.12 compatibility
    "vl-convert-python>=1.8.0",
    "wordcloud>=1.9.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pre-commit>=4.5.0",
    "ruff>=0.14.8",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
explicit_package_bases = true
disable_error_code = ["import-untyped"]
files = ["."]
exclude = [
    "^data/",
    "^dataset/",
    "^\\.venv/",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # Line length handled by formatter where possible
